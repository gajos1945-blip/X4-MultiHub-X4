name: BUILD X4 MULTIHUB v1.7 X4C HWTEST

on:
  push:
    branches:
      - main
      - hardware/x4c-s3-v1.7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x4c-bin:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MultiHub builder
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: false

      - name: Install pinned CrossPoint PlatformIO toolchain
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U \
            "littlefs-python>=0.16.0" \
            "fatfs-ng>=0.1.14" \
            "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" \
            "zopfli>=0.2.2" \
            "intelhex>=2.3.0" \
            "rich>=14.0.0" \
            "urllib3<2" \
            "cryptography>=45.0.3" \
            "certifi>=2025.8.3" \
            "ecdsa>=0.19.1" \
            "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" \
            "esp-idf-size>=2.0.0" \
            "esp-coredump>=1.14.0"

      - name: Install test dependencies
        run: uv pip install --system pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Build X4 Classic ESP32-S3 MultiHub
        run: python .builder/build_ci.py

      - name: Upload X4C v1.7 hardware-test BIN
        uses: actions/upload-artifact@v4
        with:
          name: X4_MultiHub_X4C_v1_7_hwtest
          if-no-files-found: error
          path: |
            dist/X4_MultiHub_X4C_v1.7-hwtest.bin
            dist/X4_MultiHub_X4C_v1.7-hwtest.bin.sha256.txt
            dist/build_manifest.json
            dist/source_report.json
            dist/DEV_STATUS.txt
          retention-days: 30

  build-gateway-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout MultiHub builder
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Gateway build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway/requirements-windows-build.txt

      - name: Build X4 Data Gateway EXE
        shell: pwsh
        run: |
          Set-Location gateway
          pyinstaller --noconfirm --clean X4DataGateway.spec
          if (-not (Test-Path "dist/X4DataGateway.exe")) {
            throw "X4DataGateway.exe was not created"
          }

      - name: Upload Windows Gateway
        uses: actions/upload-artifact@v4
        with:
          name: X4_Data_Gateway_Windows_v1_7_hwtest
          if-no-files-found: error
          path: |
            gateway/dist/X4DataGateway.exe
            gateway/WINDOWS_GATEWAY_README.txt
          retention-days: 30
